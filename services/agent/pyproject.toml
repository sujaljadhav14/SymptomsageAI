[project]
name = "symptomsage-agent"
version = "0.1.0"
description = "LangGraph agentic triage service for SymptomSage AI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Agent framework
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    # LLM / http
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    # data validation
    "pydantic>=2.9.0",
    # config
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
